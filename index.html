<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wild Bounty Demo</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

<header>
    <b>WILD BOUNTY <small>SHOWDOWN</small></b>
    <nav>⌕　⚙　☰</nav>
</header>

<main>

<div class="jackpot">
    DEMO JACKPOT　<b>৳ 25,680</b>
</div>

<section class="machine">

    <div class="reel-window">
        <div class="line"></div>
        <div id="reels" class="reels"></div>
    </div>

    <div id="msg">GOOD LUCK!</div>

    <div class="controls">

        <div class="bet">

            <button onclick="betChange(-10)">−</button>

            <span>
                BET<br>
                <b>৳ <i id="bet">10</i></b>
            </span>

            <button onclick="betChange(10)">+</button>

        </div>

        <button id="spin" class="spin" onclick="spin()">
            ↻
            <small>SPIN</small>
        </button>

        <div class="bal">
            VIRTUAL BALANCE<br>
            <b>৳ <i id="balance">1000</i></b>
        </div>

    </div>

</section>

<div class="tabs">
    GAME　 <span>PAYTABLE</span>　<span>HISTORY</span>
</div>

<div class="info">
    🤠 WILD　　⭐ SCATTER　　💰 BONUS
</div>

</main>

<footer>
    PLAY-MONEY DEMO • No real-money wagering, deposits or withdrawals
</footer>

</div>

<script src="app.js"></script>

</body>
</html>
